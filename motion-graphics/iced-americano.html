<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>아이스 아메리카노 손그림</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&display=swap">
<style>
  :root {
    --page: #e8e1d5;
    --panel: rgba(255, 255, 255, 0.55);
    --ink: #2e2622;
    --muted: #75685d;
    --accent: #b2432f;
    --shadow: 0 16px 44px rgba(64, 40, 20, 0.28);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #1c1613;
      --panel: rgba(255, 255, 255, 0.07);
      --ink: #efe6d8;
      --muted: #a89a8b;
      --accent: #e0765c;
      --shadow: 0 16px 44px rgba(0, 0, 0, 0.55);
    }
  }
  :root[data-theme="dark"] {
    --page: #1c1613;
    --panel: rgba(255, 255, 255, 0.07);
    --ink: #efe6d8;
    --muted: #a89a8b;
    --accent: #e0765c;
    --shadow: 0 16px 44px rgba(0, 0, 0, 0.55);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 16px;
    overflow: hidden;
  }
  #film {
    display: block;
    border-radius: 10px;
    box-shadow: var(--shadow);
    background: #cdbb9e;
    touch-action: none;
  }
  .bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 6px 14px 6px 6px;
    border-radius: 999px;
    background: var(--panel);
    max-width: 100%;
  }
  .bar button {
    flex: none;
    width: 40px;
    height: 40px;
    border: 0;
    border-radius: 50%;
    background: var(--ink);
    color: var(--page);
    display: grid;
    place-items: center;
    cursor: pointer;
  }
  .bar button:focus-visible, .bar input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .bar svg { width: 16px; height: 16px; fill: currentColor; }
  .bar input[type="range"] { flex: 1; min-width: 0; accent-color: var(--accent); cursor: pointer; }
  .bar output {
    flex: none;
    min-width: 76px;
    text-align: right;
    font-size: 13px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
<canvas id="film" width="1080" height="1920" aria-label="아이스 아메리카노 한 잔이 되기까지, 손그림 모션그래픽"></canvas>
<div class="bar" id="bar">
  <button id="playBtn" type="button" aria-label="일시정지">
    <svg id="icoPause" viewBox="0 0 16 16"><rect x="3" y="2" width="3.6" height="12" rx="1"/><rect x="9.4" y="2" width="3.6" height="12" rx="1"/></svg>
    <svg id="icoPlay" viewBox="0 0 16 16" style="display:none"><path d="M4 2.2v11.6c0 .7.8 1.1 1.4.7l8.6-5.8c.5-.3.5-1.1 0-1.4L5.4 1.5C4.8 1.1 4 1.5 4 2.2z"/></svg>
  </button>
  <input id="scrub" type="range" min="0" max="22" step="0.01" value="0" aria-label="재생 위치">
  <output id="clock">0.00 / 22.00</output>
</div>

<script>
'use strict';
/* =======================================================================
   아이스 아메리카노 — 손그림 모션그래픽
   세로 1080×1920 · 22초 · 반복
   모든 움직임은 render(t) 하나로 계산한다. 같은 t(초)면 언제나 같은 그림이 나온다.
   ======================================================================= */

/* ───────────────────────────── 1. 문구 ───────────────────────────── */
const TEXT = {
  font: '"GaeguEmbed", "Gaegu", cursive',
  charsPerSec: 10,                        // 1초에 10칸씩, 계단처럼 써진다

    { num: '4', text: '얼음 + 찬물',     x: 812, y: 3412, size: 62, t: 14.45 },

/* ───────────────────────────── 2. 색 ───────────────────────────── */
const COLOR = {
  paper: '#ECE6DA',                         // 크림색 종이
  gridMinor: 'rgba(28, 126, 126, 0.10)',    // 40칸 청록 모눈 (아주 옅게)
  gridMajor: 'rgba(28, 126, 126, 0.22)',    // 200칸마다 조금 진하게
  desk: '#CDBB9E',                          // 종이 뒤 책상
  vignette: '78, 47, 22',                   // 화면 가장자리 갈색 (r, g, b)
  pencil: '#2E2622',                        // 연필 선
  bean: '#6B4127',                          // 원두
  beanCrease: '#3A2215',                    // 원두 골
  grounds: '#5A3620',                       // 가루
  crema: '#C58E57',                         // 크레마
  espresso: '#3A2215',                      // 에스프레소 (원두 골과 같은 진한 갈색)
  ice: '#CEE8F4',                           // 얼음 하늘색
  iceEdge: '#4F7F9A',                       // 얼음 테두리
  water: 'rgba(186, 222, 240, 0.55)',       // 찬물 (아주 옅은 파랑)
  coffee: '#4A2A17',                        // 커피 (진한 갈색)
  highlighter: 'rgba(255, 221, 51, 0.66)',  // 형광 노랑 밑줄
  check: '#B2432F',                         // 빨간 체크
  retrace: '#8C5732',                       // 경로선 갈색 덧칠
};

/* ─────────────────────────── 3. 장면 시간표 (초) ─────────────────────────── */
const SCENE = {
  underline:     [0.50, 0.90],   // 제목 밑줄 긋기
  beanDrop:      [0.90, 1.28],   // 원두 한 알 낙하 → 밑줄에 착지
  beanSettle:    [1.28, 1.62],   // 찌그러졌다 튕기며 자리 잡기
  beanRoll:      [1.62, 2.05],   // 오른쪽으로 굴러감
  beanPath:      [2.05, 2.90],   // 연필 경로선을 따라 그릇으로
  bowlDraw:      [2.05, 2.55],   // 그릇 그리기
  pilePop:       [2.30, 2.95],   // 원두 더미 톡톡
  steam:         3.30,           // 김 모락모락 시작
  bowlPour:      [4.15, 4.55],   // 그릇 기울여 원두 쏟기
  grinderDraw:   [4.45, 5.45],   // 핸드 그라인더 그리기
  crank:         [5.75, 7.65],   // 손잡이 두 바퀴 넘게
  grounds:       [6.05, 8.10],   // 가루 → 포터필터
  machineDraw:   [8.25, 9.05],   // 에스프레소 머신 헤드
  tamp:          [8.95, 9.74],   // 탬퍼 꾹
  lockIn:        [9.72, 10.00],  // 포터필터 딸깍 장착
  shotGlassDraw: [9.80, 10.12],  // 샷잔 그리기
  extract:       [10.15, 11.75], // 에스프레소 두 줄기
  shotWalk:      [12.00, 12.62], // 샷잔이 걸어 내려감
  glassDraw:     [12.30, 12.95], // 큰 유리잔 그리기
  ice:           [13.10, 13.45, 13.80], // 얼음 세 개
  water:         [14.20, 15.15], // 찬물 줄기
  pour:          [15.35, 16.95], // 샷잔 기울여 붓기
  straw:         [17.25, 17.55], // 빨대 꽂기
  condense:      [17.55, 18.15], // 잔 표면 물방울
  retrace:       [18.35, 19.35], // 경로선 전체 갈색 덧칠
  checks:        [18.95, 19.45], // ①~④ 빨간 체크
};

/* ─────────────────────────── 4. 카메라 ───────────────────────────
   시각(t)에 바라보는 곳(x, y)과 확대(zoom). move = 이 키까지 움직이는 방식
   slow  천천히 — 부드럽게 다가감
   whip  휙 — 짧고 빠르게 가서 도착하면 살짝 멈칫 (이때만 모션 블러)
   accel 가속 — 점점 빨라지다 짧게 멈춤
   snap  확 줌인 — 한순간에 당김 */
const CAMERA = [
  { t: 0.00,  x: 520, y: 380,  zoom: 1.42 },
  { t: 1.90,  x: 545, y: 470,  zoom: 1.26, move: 'slow' },
  { t: 2.55,  x: 445, y: 1060, zoom: 1.16, move: 'whip' },
  { t: 4.35,  x: 450, y: 1070, zoom: 1.24, move: 'slow' },
  { t: 5.10,  x: 640, y: 1890, zoom: 1.20, move: 'accel' },
  { t: 7.75,  x: 650, y: 1930, zoom: 1.31, move: 'slow' },
  { t: 8.30,  x: 450, y: 2790, zoom: 1.15, move: 'whip' },
  { t: 10.00, x: 445, y: 2805, zoom: 1.23, move: 'slow' },
  { t: 10.45, x: 448, y: 2960, zoom: 1.55, move: 'snap' },
  { t: 11.95, x: 448, y: 2972, zoom: 1.63, move: 'slow' },
  { t: 12.60, x: 620, y: 3790, zoom: 1.06, move: 'whip' },
  { t: 15.30, x: 622, y: 3800, zoom: 1.13, move: 'slow' },
  { t: 18.25, x: 612, y: 3770, zoom: 1.28, move: 'slow' },
  { t: 18.85, x: 620, y: 2240, zoom: 0.43, move: 'accel' },   // 종이 전체가 보이게 쭉 빠짐
  { t: 19.55, x: 620, y: 2230, zoom: 0.45, move: 'slow' },
  { t: 20.12, x: 620, y: 4000, zoom: 1.07, move: 'snap' },
  { t: 22.00, x: 620, y: 4010, zoom: 1.12, move: 'slow' },
];
const PARALLAX = { pos: 0.82, zoom: 0.72 };          // 종이 뒤 낙서 층: 카메라 이동의 82%, 확대 변화의 72%
const MOTION_BLUR = { shutter: 1 / 90, maxPx: 80 };  // 휙 구간에서만

/* ─────────────────────────── 5. 무대 · 배치 ─────────────────────────── */
const STAGE = { w: 1080, h: 1920, duration: 22, boilFps: 12 };
const PAPER = { w: 1200, h: 4600, grid: 40, major: 200 };
const PENCIL = { width: 4, jitter: 2, spacing: 9, overlayAlpha: 0.45 };
const DOODLE = { deskAlpha: 0.30, paperAlpha: 0.06 };
const PLACE = {
  underlineY: 398,                 // 제목 밑줄 높이
  beanLand: { x: 760, y: 378 },    // 원두가 밑줄에 내려앉는 곳
  bowl: { x: 450, y: 1060 },
  grinder: { x: 660, y: 1900 },
  portafilter: { x: 450, y: 2905 },
  shotGlass: { x: 450, y: 2955 },
  glass: { x: 640, y: 3830 },
};

/* =======================================================================
   여기서부터 엔진
   ======================================================================= */
const TAU = Math.PI * 2;
const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, s) => a + (b - a) * s;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  inQuad: s => s * s,
  outQuad: s => 1 - (1 - s) * (1 - s),
  inCubic: s => s * s * s,
  outCubic: s => 1 - Math.pow(1 - s, 3),
  inOutSine: s => 0.5 - 0.5 * Math.cos(Math.PI * s),
  inOutCubic: s => (s < 0.5 ? 4 * s * s * s : 1 - Math.pow(-2 * s + 2, 3) / 2),
  smooth: s => s * s * (3 - 2 * s),
  outBack: (s, k = 1.9) => 1 + (k + 1) * Math.pow(s - 1, 3) + k * Math.pow(s - 1, 2),
};
// 앞부분 n승으로 가속해 s=j에서 P만큼 가고, 그 속도를 이어받아 끝에서 멈춘다
function asym(s, j, P, n) {
  if (s <= j) return P * Math.pow(s / j, n);
  const m = (n * P / j) * (1 - j) / (1 - P);
  return P + (1 - P) * (1 - Math.pow(1 - (s - j) / (1 - j), m));
}
// 키프레임 [[시각, 값], ...] 사이를 부드럽게
function track(t, K) {
  if (t <= K[0][0]) return K[0][1];
  for (let i = 1; i < K.length; i++) {
    if (t <= K[i][0]) return lerp(K[i - 1][1], K[i][1], E.smooth((t - K[i - 1][0]) / (K[i][0] - K[i - 1][0])));
  }
  return K[K.length - 1][1];
}
function hash(a, b = 0, c = 0) {
  let h = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263) + Math.imul(c | 0, 2147483647)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ───────── 도형 점 만들기 ───────── */
function ellipsePts(cx, cy, rx, ry, a0 = 0, a1 = TAU, n = 48) {
  const o = [];
  for (let i = 0; i <= n; i++) {
    const a = lerp(a0, a1, i / n);
    o.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]);
  }
  return o;
}
function roundRectPts(x0, y0, x1, y1, r, n = 5) {
  const o = [];
  const corner = (cx, cy, a0) => {
    for (let i = 0; i <= n; i++) {
      const a = a0 + (i / n) * (Math.PI / 2);
      o.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
    }
  };
  corner(x0 + r, y0 + r, Math.PI);
  corner(x1 - r, y0 + r, -Math.PI / 2);
  corner(x1 - r, y1 - r, 0);
  corner(x0 + r, y1 - r, Math.PI / 2);
  return o;
}
function catmull(pts, n = 12) {
  if (pts.length < 3) return pts.map(p => p.slice());
  const P = [pts[0], ...pts, pts[pts.length - 1]], out = [];
  for (let i = 1; i < P.length - 2; i++) {
    const p0 = P[i - 1], p1 = P[i], p2 = P[i + 1], p3 = P[i + 2];
    for (let k = 0; k < n; k++) {
      const s = k / n, s2 = s * s, s3 = s2 * s;
      const f = d => 0.5 * (2 * p1[d] + (-p0[d] + p2[d]) * s + (2 * p0[d] - 5 * p1[d] + 4 * p2[d] - p3[d]) * s2 + (-p0[d] + 3 * p1[d] - 3 * p2[d] + p3[d]) * s3);
      out.push([f(0), f(1)]);
    }
  }
  out.push(pts[pts.length - 1].slice());
  return out;
}
function teardropPts(w, h, n = 22) {    // 위가 뾰족한 물방울
  const o = [];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * TAU;
    o.push([w * Math.sin(a) * Math.sin(a / 2), -0.5 * h * Math.cos(a)]);
  }
  return o;
}

/* ───────── 연필 선 ─────────
   점을 이어 그리되 점마다 좌우로 2px쯤 흔든다. 흔들림만 다른 3벌을 1초에 12번 번갈아 보여 준다.
   진한 선(굵기 4) 위에 절반 굵기 · 45% 선을 한 번 더 겹친다. p(0→1)로 한쪽 끝부터 그어진다. */
const FRAME = { t: 0, boil: 0 };
let seedCounter = 1;
function resample(pts, step, closed) {
  const P = closed ? pts.concat([pts[0]]) : pts;
  const L = [0];
  for (let i = 1; i < P.length; i++) L.push(L[i - 1] + Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]));
  const total = L[L.length - 1];
  const n = Math.max(2, Math.round(total / step) + 1);
  const out = new Float32Array(n * 2);
  let j = 1;
  for (let i = 0; i < n; i++) {
    const d = (total * i) / (n - 1);
    while (j < P.length - 1 && L[j] < d) j++;
    const s = clamp((d - L[j - 1]) / ((L[j] - L[j - 1]) || 1));
    out[i * 2] = lerp(P[j - 1][0], P[j][0], s);
    out[i * 2 + 1] = lerp(P[j - 1][1], P[j][1], s);
  }
  return out;
}
function jitterPts(base, seed, variant, J, closed) {
  const n = base.length / 2, out = new Float32Array(base.length);
  for (let i = 0; i < n; i++) {
    const i0 = Math.max(0, i - 1), i1 = Math.min(n - 1, i + 1);
    let tx = base[i1 * 2] - base[i0 * 2], ty = base[i1 * 2 + 1] - base[i0 * 2 + 1];
    const tl = Math.hypot(tx, ty) || 1;
    tx /= tl; ty /= tl;
    const jn = (hash(seed, i, variant) * 2 - 1) * J;
    const jt = (hash(seed, i, variant + 11) * 2 - 1) * J * 0.3;
    out[i * 2] = base[i * 2] - ty * jn + tx * jt;
    out[i * 2 + 1] = base[i * 2 + 1] + tx * jn + ty * jt;
  }
  if (closed) { out[(n - 1) * 2] = out[0]; out[(n - 1) * 2 + 1] = out[1]; }
  return out;
}
function withLengths(xy) {
  const n = xy.length / 2, len = new Float32Array(n);
  for (let i = 1; i < n; i++) len[i] = len[i - 1] + Math.hypot(xy[i * 2] - xy[i * 2 - 2], xy[i * 2 + 1] - xy[i * 2 - 1]);
  return { xy, len, total: len[n - 1] };
}
class Stroke {
  constructor(pts, o = {}) {
    this.closed = !!o.closed;
    this.width = o.width ?? PENCIL.width;
    this.color = o.color ?? COLOR.pencil;
    this.dash = o.dash ?? null;
    this.overlay = o.overlay ?? true;
    const seed = o.seed ?? (seedCounter++ * 7919);
    const base = resample(pts, o.spacing ?? PENCIL.spacing, this.closed);
    const J = o.jitter ?? PENCIL.jitter;
    this.v = [0, 1, 2].map(k => withLengths(jitterPts(base, seed, k, J, this.closed)));
  }
}
const S = (pts, o) => new Stroke(pts, o);

function tracePath(g, v, p0, p1, closed) {
  const { xy, len, total } = v, n = len.length;
  const a = total * p0, b = total * p1;
  let i = 1;
  while (i < n - 1 && len[i] < a) i++;
  const sa = clamp((a - len[i - 1]) / ((len[i] - len[i - 1]) || 1));
  g.moveTo(lerp(xy[i * 2 - 2], xy[i * 2], sa), lerp(xy[i * 2 - 1], xy[i * 2 + 1], sa));
  for (; i < n; i++) {
    if (len[i] >= b && p1 < 1) {
      const sb = clamp((b - len[i - 1]) / ((len[i] - len[i - 1]) || 1));
      g.lineTo(lerp(xy[i * 2 - 2], xy[i * 2], sb), lerp(xy[i * 2 - 1], xy[i * 2 + 1], sb));
      return;
    }
    g.lineTo(xy[i * 2], xy[i * 2 + 1]);
  }
  if (closed && p0 <= 0) g.closePath();
}
function strokeVariants(g, v0, v1, p0, p1, closed, o) {
  const w = o.width, a = o.alpha;
  g.lineCap = o.cap || 'round';

/* 주인공 원두 */
function heroState(t) {
  const H = BEANS.hero;
  const [d0, d1] = SCENE.beanDrop, [, s1] = SCENE.beanSettle, [r0, r1] = SCENE.beanRoll, [p0, p1] = SCENE.beanPath;
  const land = PLACE.beanLand;
  if (t < d0) return null;
  if (t < d1) {
    const s = seg(t, d0, d1);
    return { x: lerp(land.x + 18, land.x, s), y: lerp(-380, land.y, s * s), rot: (1 - s) * 5.4, sx: 1, sy: 1, phase: 'fall' };
  }
  if (t < s1) {
    const u = t - d1;
    const sy = track(u, [[0, 0.6], [0.06, 1.14], [0.14, 1], [0.21, 1.03], [0.24, 0.86], [0.29, 1.03], [0.34, 1]]);
    const hop = track(u, [[0, 0], [0.06, -10], [0.13, -22], [0.2, -6], [0.24, 0], [0.34, 0]]);
    const bottom = underlineY(land.x) + underlineDip(land.x, t);
    return { x: land.x, y: bottom + hop - H.ry * sy, rot: 0, sx: 1 / Math.pow(sy, 0.8), sy, phase: 'land' };
  }
  const rollEnd = UNDER.x1;
  if (t < r1) {
    const rock = -0.25 * Math.sin(Math.PI * seg(t, r0, r0 + 0.1));
    const x = heroRollX(t), rot = rock + (x - land.x) / 25;
    return { x, y: underlineY(x) + 2.2 - supportH(H, rot), rot, sx: 1, sy: 1, phase: 'roll' };
  }
  const rotRoll = (rollEnd - land.x) / 25;

    const s = seg(t, p0, p1), f = 0.5 * s + 0.5 * E.inOutSine(s);
    const p = ROUTE.bean.at(f);
    return { x: p.x, y: p.y, rot: rotRoll + (f * ROUTE.bean.total) / 25, sx: 1, sy: 1, phase: 'path', f };
  }
  const rotEnd = rotRoll + ROUTE.bean.total / 25;
  const rest = Math.round(rotEnd / Math.PI) * Math.PI + 0.12;
  const u = t - p1;
  const sy = track(u, [[0, 0.72], [0.07, 1.08], [0.14, 0.97], [0.2, 1]]);
  return { x: BOWL.heroRest.x, y: BOWL.heroRest.y + H.ry * (1 - sy), rot: lerp(rotEnd, rest, E.outCubic(seg(u, 0, 0.18))), sx: 1 / Math.pow(sy, 0.8), sy, phase: 'bowl' };
}

function drawImpact(g, x, y, t, t0, o = {}) {

    fill(g, PF.tKnob, paperStyle(g));
    draw(g, PF.tKnob);
    g.restore();
  }
}

/* 샷잔 · 에스프레소 · 붓기 */
function shotPose(t) {
  const [w0, w1] = SCENE.shotWalk, [q0, q1] = SCENE.pour;
  if (t < w0) return { x: PLACE.shotGlass.x, y: PLACE.shotGlass.y + SG.h / 2, rot: 0, walk: false };
  if (t < w1) {
    const s = seg(t, w0, w1), f = E.inOutSine(s), p = ROUTE.walk.at(f);
    const hop = -13 * Math.abs(Math.sin(s * Math.PI * 5)) * (1 - s * 0.6);
    return { x: p.x, y: p.y + hop, rot: 0.2 * Math.sin(s * TAU * 2.5) * (1 - Math.pow(s, 3)), walk: true, f };
  }
  const rest = ROUTE.walk.at(1);
  if (t < q0 || t > q1) return { x: rest.x, y: rest.y, rot: 0, walk: false };
  // 붓기: 중심(C)을 옮기고 기울인다
  const cx = track(t, [[q0, rest.x], [q0 + 0.27, 480], [q0 + 0.47, 519], [q1 - 0.4, 519], [q1 - 0.17, 480], [q1, rest.x]]);
  const cy = track(t, [[q0, rest.y - SG.h / 2], [q0 + 0.27, 3560], [q0 + 0.47, 3530], [q1 - 0.4, 3530], [q1 - 0.17, 3560], [q1, rest.y - SG.h / 2]]);
  const rot = track(t, [[q0, 0], [q0 + 0.2, 0.3], [q0 + 0.47, 1.95], [q1 - 0.4, 1.95], [q1 - 0.17, 0.25], [q1, 0]]) + 0.03 * Math.sin(t * 17) * seg(t, q0 + 0.47, q0 + 0.6) * (1 - seg(t, q1 - 0.45, q1 - 0.4));
  return { cx, cy, rot, pour: true };
}
function shotXform(g, P) {              // 원점 = 샷잔 바닥 가운데
  if (P.pour) { g.translate(P.cx, P.cy); g.rotate(P.rot); g.translate(0, SG.h / 2); }
  else { g.translate(P.x, P.y); g.rotate(P.rot); }
}
function drawShotGlass(g, t) {
  const [a, b] = SCENE.shotGlassDraw;
  const [e0, e1] = SCENE.extract;
  const [q0, q1] = SCENE.pour;
  const P = shotPose(t);
  // 트레이 (머신 아래)
  if (t >= a) {
    draw(g, SG.tray, pr(t, a, a + 0.14));
    SG.grate.forEach((s, k) => draw(g, s, pr(t, a + 0.08 + k * 0.02, a + 0.14 + k * 0.02)));
  }
  if (t < a) return;
  // 에스프레소 두 줄기
  const pfy = portafilterY(t);
  const level = espressoLevel(t);
  const surfY = PLACE.shotGlass.y + SG.h / 2 - 9 - level;
  if (t >= e0 && t < e1 && !P.walk) {
    const head = lerp(pfy + 61, surfY, E.inQuad(seg(t, e0, e0 + 0.12)));
    const tail = lerp(pfy + 61, surfY, E.inQuad(seg(t, e1 - 0.2, e1 - 0.06)));
    if (head > tail + 1) {
      for (const sx of [-14, 14]) {
        const pts = [];
        for (let i = 0; i <= 10; i++) {
          const y = lerp(tail, head, i / 10);
          pts.push([PLACE.shotGlass.x + sx + 1.6 * Math.sin(y / 11 - t * 22 + sx), y]);
        }
        live(g, pts, { color: COLOR.espresso, width: 5, seed: 1500 + sx, jitter: 0.8, spacing: 6 });
      }
    }
  }
  // 똑똑 떨어지는 방울
  [0, 1, 2].forEach(k => {
    const td = e1 - 0.05 + k * 0.1, s = seg(t, td, td + 0.1);
    if (s <= 0 || s >= 1 || t >= SCENE.shotWalk[0]) return;
    const x = PLACE.shotGlass.x + (k % 2 ? 14 : -14), y = lerp(pfy + 63, surfY, s * s);
    live(g, teardropPts(4, 10).map(([u, v]) => [x + u, y + v]), { closed: true, fill: COLOR.espresso, width: 2.4, seed: 1510 + k, jitter: 0.5 });
  });
  g.save();
  shotXform(g, P);
  const dp = k => pr(t, a + k * 0.06, a + 0.14 + k * 0.06);
  // 안의 커피
  const pourDrain = seg(t, q0 + 0.5, q1 - 0.45);
  if (!P.pour || P.rot < 0.45) {
    const lv = t >= q1 ? 0 : level * (1 - pourDrain);
    if (lv > 0.5) {
      const yt = -9 - lv, cr = Math.min(9, 2 + lv * 0.14);
      const poly = [[-sgHalfW(yt), yt], [sgHalfW(yt), yt], [sgHalfW(-9), -9], [-sgHalfW(-9), -9]];
      live(g, poly, { closed: true, fill: COLOR.espresso, stroke: false, seed: 1520, jitter: 0.6 });
      const crema = [[-sgHalfW(yt), yt], [sgHalfW(yt), yt], [sgHalfW(yt + cr), yt + cr], [-sgHalfW(yt + cr), yt + cr]];
      live(g, crema, { closed: true, fill: COLOR.crema, stroke: false, seed: 1521, jitter: 0.6 });
      live(g, ellipsePts(0, yt, sgHalfW(yt), 4, 0, TAU, 20), { closed: true, fill: COLOR.crema, width: 2.4, seed: 1522, jitter: 0.5, color: COLOR.espresso, alpha: 0.9 });
    }
  } else if (pourDrain < 1) {
    // 기울어진 잔: 입구 쪽에 고인 커피만 (화면 기준 수평)
    g.save();
    g.beginPath();
    g.moveTo(-36, -85); g.lineTo(36, -85); g.lineTo(29, -9); g.lineTo(-29, -9); g.closePath();
    g.clip();
    const M = g.getTransform();
    g.setTransform(CAM_M);
    const lip = new DOMPoint(37, -86).matrixTransform(CAM_INV.multiply(M));
    const cy = lip.y - lerp(34, -4, pourDrain);
    g.fillStyle = COLOR.espresso;
    g.fillRect(lip.x - 200, cy, 400, 300);
    g.setTransform(M);
    g.restore();
  }
  // 잔
  if (t >= q1 && t < q1 + 30) {
    live(g, [[-26, -9], [-10, -11], [10, -10], [26, -9]], { color: COLOR.crema, width: 3, seed: 1530, jitter: 0.6, overlay: false });
  }
  SG.walls.forEach(s => draw(g, s, dp(0)));
  draw(g, SG.bottom, dp(1));
  draw(g, SG.rim, dp(1.5));
  draw(g, SG.inner, dp(2.5));
  draw(g, SG.hl, dp(3), { alpha: 0.5 });
  g.restore();
  // 붓는 커피 줄기 (곡선)
  if (P.pour) {
    const sStart = q0 + 0.45, sEnd = q1 - 0.42;
    if (t > sStart && t < sEnd + 0.14) {
      const M = new DOMMatrix().translate(P.cx, P.cy).rotate((P.rot * 180) / Math.PI).translate(0, SG.h / 2);
      const lip = new DOMPoint(37, -86).matrixTransform(M);
      const surf = waterSurface(t) ?? GL.floor;
      const end = [580, surf - 2];
      const head = E.inQuad(seg(t, sStart, sStart + 0.12)), tail = E.inQuad(seg(t, sEnd, sEnd + 0.14));
      const pts = [];
      for (let i = 0; i <= 16; i++) {
        const u = lerp(tail, head, i / 16);
        const c1 = [lip.x + 26 + 3 * Math.sin(t * 19), lip.y + 40];
        const x = (1 - u) * (1 - u) * lip.x + 2 * (1 - u) * u * c1[0] + u * u * end[0];
        const y = (1 - u) * (1 - u) * lip.y + 2 * (1 - u) * u * c1[1] + u * u * end[1];
        pts.push([x + 1.2 * Math.sin(u * 14 - t * 30), y]);
      }
      live(g, pts, { color: COLOR.coffee, width: 8, seed: 1540, jitter: 0.8, spacing: 6 });
    }
  }
}

/* 큰 유리잔 · 얼음 · 찬물 · 커피 · 빨대 · 물방울 · 반짝이 */
function drawGlass(g, t) {
  const [a] = SCENE.glassDraw;
  if (t < a) return;
  const cx = PLACE.glass.x;
  draw(g, GL.rimBack, pr(t, a, a + 0.12));
  const surf = waterSurface(t), ct = coffeeTop(t);
  const ices = iceAll(t);
  // 물 · 커피 (얼음보다 먼저 그려 뒤쪽에 둔다)
  const [, w1] = SCENE.water;
  const amp = t < w1 ? 3 : 3 * Math.exp(-(t - w1) / 0.5) + 0.8;
  const wave = x => amp * Math.sin(x * 0.045 - t * 9);
  let backArc = null;
  if (surf !== null) {
    const hw = (GL.right(surf) - GL.left(surf)) / 2;
    backArc = ellipsePts(cx, surf, hw, 11, Math.PI, TAU, 28).map(([x, y]) => [x, y + wave(x)]);
    g.save();
    clipInterior(g);
    live(g, [...backArc, [GL.right(surf) + 4, GL.floor + 20], [GL.left(surf) - 4, GL.floor + 20]], { closed: true, fill: COLOR.water, stroke: false, seed: 1600, jitter: 0.6 });
    if (ct !== null) {
      const cw = x => 4 * Math.sin(x * 0.05 + t * 6) + 3 * Math.sin(x * 0.11 - t * 4);
      if (ct > surf + 2) {                       // 섞여 드는 경계는 부드럽게

        grad.addColorStop(0, 'rgba(74, 42, 23, 0)');
        grad.addColorStop(1, 'rgba(74, 42, 23, 0.5)');
        g.fillStyle = grad;
        g.fillRect(cx - 170, y0, 340, ct + 6 - y0);
      }
      const cb = [];
      for (let x = GL.left(surf) - 6; x <= GL.right(surf) + 6; x += 10) cb.push([x, Math.max(ct + cw(x), surf + wave(x))]);
      live(g, [...cb, [GL.right(surf) + 6, GL.floor + 20], [GL.left(surf) - 6, GL.floor + 20]], { closed: true, fill: COLOR.coffee, fillAlpha: 0.9, stroke: false, seed: 1602, jitter: 0.8 });
      const topMix = clamp((surf + 26 - ct) / 26);

    STRAW.ridges.forEach(s => draw(g, s));

  });
  // 물속에 잠긴 부분(얼음 · 빨대)은 물빛 · 커피빛으로
  if (surf !== null) {
    g.save();
    clipInterior(g);
    g.beginPath();
    g.moveTo(GL.left(surf) - 10, GL.floor + 30);
    for (let x = GL.left(surf) - 10; x <= GL.right(surf) + 10; x += 10) g.lineTo(x, surf + wave(x));
    g.lineTo(GL.right(surf) + 10, GL.floor + 30);
    g.closePath();
    g.clip();
    g.fillStyle = COLOR.water;
    g.globalAlpha = 0.5;
    g.fillRect(cx - 170, surf - 20, 340, 460);
    if (ct !== null) {
      g.fillStyle = COLOR.coffee;
      g.globalAlpha = 0.45;
      g.fillRect(cx - 170, ct, 340, 460);
    }
    g.globalAlpha = 1;
    g.restore();
    const hw = (GL.right(surf) - GL.left(surf)) / 2;
    const front = ellipsePts(cx, surf, hw, 11, 0, Math.PI, 28).map(([x, y]) => [x, y + wave(x)]);
    live(g, front, { color: COLOR.iceEdge, width: 3, alpha: 0.75, seed: 1610, jitter: 1 });
    // 소용돌이 선
    drawSwirl(g, t);
  }
  drawWaterStream(g, t);
  // 잔 앞면
  const p = k => pr(t, a + 0.06 + k * 0.08, a + 0.22 + k * 0.08);
  draw(g, GL.rimFront, p(0));
  GL.walls.forEach((s, k) => draw(g, s, p(1 + k * 0.6)));
  draw(g, GL.base, p(3));
  draw(g, GL.inner, p(3.8));
  GL.hl.forEach((s, k) => draw(g, s, p(4.5 + k * 0.5), { alpha: 0.4 }));
  // 물방울
  const [d0] = SCENE.condense;
  DROPS.forEach(([x, y, r], k) => {
    const T = d0 + k * 0.05;
    const s = seg(t, T, T + 0.14);
    if (s <= 0) return;
    const sc = E.outBack(s, 2.2), slide = k % 4 === 1 ? 14 * E.inOutSine(seg(t, T + 0.3, T + 1.4)) : 0;
    g.save();

    g.restore();
  });
  // 반짝임 선
  const st5 = TEXT.steps[4].t;
  SPARKS.forEach((q, k) => {
    const T = st5 + k * 0.08, s = pr(t, T, T + 0.14);
    if (s <= 0) return;

    g.translate(q.x, q.y);
    g.scale(pulse, pulse);
    if (q.type === 'fan') {
      for (let i = -1; i <= 1; i++) {
        const an = q.ang + i * 0.5;
        live(g, [[Math.cos(an) * 12, Math.sin(an) * 12], [Math.cos(an) * (i ? 40 : 52), Math.sin(an) * (i ? 40 : 52)]], { p: s, width: 4, seed: 1800 + k * 5 + i, jitter: 0.8 });
      }
    } else {
      const R = q.r, pts = [];
      for (let i = 0; i < 8; i++) { const an = (i / 8) * TAU - Math.PI / 2, rr = i % 2 ? R * 0.28 : R; pts.push([Math.cos(an) * rr, Math.sin(an) * rr]); }
      live(g, pts, { closed: true, p: s, width: 3.2, seed: 1820 + k, jitter: 0.6, spacing: 5 });
    }

}
function drawSplash(g, x, y, t, t0, k) {
  const u = t - t0;
  if (u < 0 || u > 0.4) return;
  for (let i = 0; i < 6; i++) {
    const side = i % 2 ? 1 : -1, sp = 60 + 70 * hash(i, k, 3), up = 160 + 120 * hash(i, k, 4);
    const px = x + side * (30 + 10 * i) + side * sp * u, py = y - 20 + (-up * u + 700 * u * u);
    const r = 5 * (1 - u / 0.45);
    live(g, ellipsePts(px, py, r, r * 1.2, 0, TAU, 10), { closed: true, fill: COLOR.ice, color: COLOR.iceEdge, width: 2.2, seed: 1650 + i + k * 7, jitter: 0.4, spacing: 4 });
  }
}
function drawWaterStream(g, t) {
  const [a, b] = SCENE.water;
  if (t < a || t > b) return;
  const x = 588, top = 2860;
  const surf = waterSurface(t) ?? GL.floor;
  const head = Math.min(lerp(top, GL.floor, E.inQuad(seg(t, a, a + 0.14))), surf + 4);
  const tail = lerp(top, surf, E.inQuad(seg(t, b - 0.16, b)));
  if (head <= tail + 2) return;
  const L = [], R = [];
  for (let i = 0; i <= 18; i++) {
    const y = lerp(tail, head, i / 18), wob = 2.5 * Math.sin(y / 34 - t * 14);
    const w = 11 + 2 * Math.sin(y / 20 + t * 9);
    L.push([x - w + wob, y]); R.push([x + w + wob, y]);
  }
  live(g, [...L, ...R.slice().reverse()], { closed: true, fill: COLOR.water, stroke: false, seed: 1620, jitter: 0.6 });
  live(g, L, { color: COLOR.iceEdge, width: 2.6, alpha: 0.7, seed: 1621, jitter: 0.8 });
  live(g, R, { color: COLOR.iceEdge, width: 2.6, alpha: 0.7, seed: 1622, jitter: 0.8 });
}
function drawSwirl(g, t) {
  const [a, b] = SCENE.pour;
  const t0 = a + 0.65, fade = 1 - seg(t, b + 0.05, b + 0.45);
  if (t < t0 || fade <= 0) return;
  const p = E.outQuad(seg(t, t0, t0 + 0.55));

    const pts = [], rot = (t - t0) * 2.2 + k;
    for (let i = 0; i <= 40; i++) {
      const u = i / 40, an = rot + u * TAU * 1.6, r = (14 + 64 * u) * sc;
      pts.push([x + Math.cos(an) * r, y + Math.sin(an) * r * 0.32]);
    }
    live(g, pts, { p, color: COLOR.ice, alpha: 0.85 * fade, width: 3.4, seed: 1630 + k, jitter: 1, overlay: false });

}

/* 경로선 · 갈색 덧칠 */
function drawRoutes(g, t) {
  const h = heroState(t);
  let pBean = 0;
  if (t >= SCENE.beanPath[0] - 0.05) pBean = Math.min(1, (h && h.phase === 'path' ? h.f : 1) + 0.08 * seg(t, SCENE.beanPath[0] - 0.05, SCENE.beanPath[0] + 0.05));
  const [f0] = SCENE.bowlPour;
  const pPour = pr(t, f0 + 0.05, f0 + 0.05 + 0.66);
  const [g0] = SCENE.grounds;
  const pGround = E.outQuad(seg(t, g0 - 0.05, g0 + 0.8));
  const [w0, w1] = SCENE.shotWalk;
  const pWalk = t < w0 - 0.05 ? 0 : Math.min(1, E.inOutSine(seg(t, w0, w1)) + 0.08 * seg(t, w0 - 0.05, w0 + 0.05));
  draw(g, ROUTE.bean.line, pBean);
  draw(g, ROUTE.pour.line, pPour);
  draw(g, ROUTE.grounds.line, pGround);
  draw(g, ROUTE.walk.line, pWalk);
  // 카메라가 빠지는 동안 지나온 길 전체를 갈색으로 한 번 더
  const [r0, r1] = SCENE.retrace;
  if (t >= r0) {
    const list = [ROUTE.bean, ROUTE.pour, ROUTE.grounds, ROUTE.walk];
    const total = list.reduce((s, r) => s + r.total, 0);
    let d = E.inOutSine(seg(t, r0, r1)) * total;
    for (const r of list) {
      draw(g, r.brown, clamp(d / r.total), { alpha: 0.85 });
      d -= r.total;
      if (d <= 0) break;
    }
  }
}

/* =======================================================================
   render(t) — t(초) 하나로 한 장면을 통째로 그린다
   ======================================================================= */
const canvas = document.getElementById('film');
const ctx = canvas.getContext('2d');
let OVERLAY = [], BLUR = null, BLUR_CTX = null;

function drawPaper(g, cam) {
  const hw = STAGE.w / 2 / cam.z, hh = STAGE.h / 2 / cam.z;
  const vx0 = cam.x - hw, vx1 = cam.x + hw, vy0 = cam.y - hh, vy1 = cam.y + hh;
  const edge = vx0 < 60 || vy0 < 60 || vx1 > PAPER.w - 60 || vy1 > PAPER.h - 60;
  if (edge) {                               // 종이 그림자 (가장자리가 보일 때만)
    g.strokeStyle = 'rgba(58, 36, 18, 0.07)';
    for (const w of [10, 22, 38]) { g.lineWidth = w; g.strokeRect(0, 8, PAPER.w, PAPER.h); }
  }
  const x0 = Math.max(0, vx0), y0 = Math.max(0, vy0), x1 = Math.min(PAPER.w, vx1), y1 = Math.min(PAPER.h, vy1);
  if (x1 <= x0 || y1 <= y0) return;
  g.fillStyle = COLOR.paper;
  g.fillRect(x0, y0, x1 - x0, y1 - y0);
  // 모눈: 40칸마다 아주 옅게, 200칸마다 조금 진하게
  const G = PAPER.grid, M = PAPER.major;
  g.lineWidth = 1.3;
  g.strokeStyle = COLOR.gridMinor;
  g.beginPath();
  for (let x = Math.ceil(x0 / G) * G; x <= x1; x += G) if (x % M) { g.moveTo(x, y0); g.lineTo(x, y1); }
  for (let y = Math.ceil(y0 / G) * G; y <= y1; y += G) if (y % M) { g.moveTo(x0, y); g.lineTo(x1, y); }
  g.stroke();
  g.lineWidth = 1.8;
  g.strokeStyle = COLOR.gridMajor;
  g.beginPath();
  for (let x = Math.ceil(x0 / M) * M; x <= x1; x += M) { g.moveTo(x, y0); g.lineTo(x, y1); }
  for (let y = Math.ceil(y0 / M) * M; y <= y1; y += M) { g.moveTo(x0, y); g.lineTo(x1, y); }
  g.stroke();
  if (edge) {
    g.strokeStyle = 'rgba(90, 64, 40, 0.3)';
    g.lineWidth = 1.5;
    g.strokeRect(0, 0, PAPER.w, PAPER.h);
    if (vy0 < 60) {                         // 연습장에서 뜯어낸 구멍
      for (let x = 44; x < PAPER.w; x += 62) {
        g.fillStyle = COLOR.desk;
        g.beginPath(); g.ellipse(x, 24, 8, 8, 0, 0, TAU); g.fill();
        g.strokeStyle = 'rgba(70, 48, 28, 0.35)';
        g.lineWidth = 1.2;
        g.stroke();
      }
    }
  }
}

// 반씩 밀어 겹치기를 k번 반복하면 2^k개의 고른 샘플로 번진다 (정수 픽셀 이동이라 빠르다)
function motionBlur(g, mb) {
  const k = Math.max(1, Math.min(5, Math.ceil(Math.log2(mb.L / 2.5))));
  const steps = [];
  for (let i = 1; i <= k; i++) steps.push([(mb.dx * RES) / 2 ** i, (mb.dy * RES) / 2 ** i]);
  const mx = steps.reduce((a, v) => a + v[0], 0) / 2, my = steps.reduce((a, v) => a + v[1], 0) / 2;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.imageSmoothingEnabled = false;
  BLUR_CTX.globalCompositeOperation = 'copy';
  steps.forEach(([sx, sy], i) => {
    BLUR_CTX.drawImage(canvas, 0, 0);
    const ox = i ? 0 : -mx, oy = i ? 0 : -my;
    if (!i) { g.globalAlpha = 1; g.drawImage(BLUR, Math.round(ox), Math.round(oy)); }
    g.globalAlpha = 0.5;
    g.drawImage(BLUR, Math.round(ox + sx), Math.round(oy + sy));
  });
  g.globalAlpha = 1;
  g.imageSmoothingEnabled = true;
}

function render(t) {
  const D = STAGE.duration;
  t = ((t % D) + D) % D;
  FRAME.t = t;
  FRAME.boil = Math.floor(t * STAGE.boilFps + 1e-6) % 3;
  const g = ctx, cam = camAt(t), lc = layerCam(cam);
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = 1;
  g.globalCompositeOperation = 'source-over';
  g.fillStyle = COLOR.desk;
  g.fillRect(0, 0, canvas.width, canvas.height);
  // 종이 뒤 낙서 층 (느린 카메라)
  applyCam(g, lc);
  drawDoodles(g, lc, DOODLE.deskAlpha);
  // 종이
  applyCam(g, cam);
  CAM_M = g.getTransform();
  CAM_INV = CAM_M.inverse();
  drawPaper(g, cam);
  g.save();
  g.beginPath(); g.rect(0, 0, PAPER.w, PAPER.h); g.clip();
  applyCam(g, lc);
  drawDoodles(g, lc, DOODLE.paperAlpha);      // 종이 너머로 비치는 낙서
  g.restore();
  applyCam(g, cam);
  drawScene(g, t);
  // 휙 넘어갈 때만 모션 블러
  const mb = blurFor(t);
  if (mb) motionBlur(g, mb);
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.drawImage(OVERLAY[FRAME.boil], 0, 0);
}

   준비 · 재생기

// 캔버스 픽셀 수를 화면에 보이는 크기에 맞춘다 (최대 1080×1920). 주소 끝에 ?full 을 붙이면 항상 1080×1920
const FORCE_FULL = /[?&]full\b/.test(location.search);
function setResolution(bw) {
  bw = Math.round(clamp(bw, 180, STAGE.w) / 9) * 9;       // 9의 배수면 16:9가 딱 떨어진다
  const bh = (bw / 9) * 16;
  if (canvas.width !== bw || canvas.height !== bh) { canvas.width = bw; canvas.height = bh; }
  RES = bw / STAGE.w;
  OVERLAY = [0, 1, 2].map(k => makeOverlay(k, bw, bh));
  BLUR.width = bw; BLUR.height = bh;
}
function build() {
  PAPER_PATTERN = makePaperPattern(ctx);
  BLUR = document.createElement('canvas');
  BLUR_CTX = BLUR.getContext('2d');
  setResolution(canvas.width);
  buildRoutes();
  buildBowl();
  buildFlights();
  buildGrinder();
  buildGrounds();
  buildPortafilter();
  buildMachine();
  buildShotGlass();
  buildGlass();
  buildIce();
  buildStraw();
  buildLabels();
  buildDoodles();
}
build();

const player = { playing: true, t: 0, last: null, dragging: false };
let booted = false;
const scrub = document.getElementById('scrub');
const clock = document.getElementById('clock');
const playBtn = document.getElementById('playBtn');
const bar = document.getElementById('bar');
function paint() {
  render(player.t);
  scrub.value = player.t.toFixed(2);
  clock.textContent = `${player.t.toFixed(2)} / ${STAGE.duration.toFixed(2)}`;
}
function setPlaying(on) {
  player.playing = on;
  player.last = null;
  document.getElementById('icoPause').style.display = on ? '' : 'none';
  document.getElementById('icoPlay').style.display = on ? 'none' : '';
  playBtn.setAttribute('aria-label', on ? '일시정지' : '재생');
}
function seek(t) {
  player.t = clamp(t, 0, STAGE.duration - 1e-3);
  paint();
}
function tick(now) {
  if (player.playing && !player.dragging) {
    if (player.last !== null) player.t = (player.t + Math.min(0.1, (now - player.last) / 1000)) % STAGE.duration;
    player.last = now;
    paint();
  }
  requestAnimationFrame(tick);
}
playBtn.addEventListener('click', () => setPlaying(!player.playing));
scrub.addEventListener('pointerdown', () => { player.dragging = true; });
scrub.addEventListener('input', () => { player.dragging = true; seek(parseFloat(scrub.value)); });
const endDrag = () => { if (player.dragging) { player.dragging = false; player.last = null; } };
scrub.addEventListener('pointerup', endDrag);
scrub.addEventListener('change', endDrag);
window.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); setPlaying(!player.playing); }
  else if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') {
    e.preventDefault();
    setPlaying(false);
    seek(player.t + (e.code === 'ArrowRight' ? 1 : -1) * (e.shiftKey ? 1 : 1 / STAGE.boilFps));
  }
});
function layout() {
  const pad = 16, gap = 12;
  const availW = window.innerWidth - pad * 2;
  const availH = window.innerHeight - pad * 2 - bar.offsetHeight - gap;
  const s = Math.max(0.05, Math.min(availW / STAGE.w, availH / STAGE.h));
  canvas.style.width = `${Math.floor(STAGE.w * s)}px`;
  canvas.style.height = `${Math.floor(STAGE.h * s)}px`;
  bar.style.width = `${Math.max(Math.floor(STAGE.w * s), Math.min(availW, 280))}px`;
  const want = FORCE_FULL ? STAGE.w : Math.round(STAGE.w * s * (window.devicePixelRatio || 1));
  if (Math.abs(Math.min(want, STAGE.w) - canvas.width) > 2) { setResolution(want); if (booted) paint(); }
}
window.addEventListener('resize', layout);
layout();

// 밖에서도 쓸 수 있게
window.render = render;
window.player = { play: () => setPlaying(true), pause: () => setPlaying(false), seek, get t() { return player.t; } };

(function boot() {
  let ready = Promise.resolve();
  if (window.FontFace && document.fonts) {
    try {
      const face = new FontFace('GaeguEmbed', `url(data:font/woff2;base64,${GAEGU_WOFF2})`, { weight: '700' });
      document.fonts.add(face);
      ready = Promise.race([face.load(), new Promise(r => setTimeout(r, 1500))]);
    } catch (e) { /* 글꼴이 없어도 재생은 된다 */ }
    // 구글 폰트 글자가 늦게 도착해도 글자 폭을 다시 잰다
    document.fonts.addEventListener('loadingdone', () => { FONT_EPOCH++; widthCache.clear(); if (!player.playing) paint(); });
  }
  ready.catch(() => {}).then(() => {
    booted = true;
    FONT_EPOCH++;
    widthCache.clear();
    paint();
    requestAnimationFrame(tick);
  });
})();
</script>
